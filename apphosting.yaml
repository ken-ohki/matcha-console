# Firebase App Hosting backend configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 2
  minInstances: 0
  concurrency: 80

env:
  # Public (client-side) Firebase config — embedded in client bundle, not sensitive
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBjT4phid4PDzjJ9pR9D2jMF76h1sQhr1M
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: sabo-matcha-1767687963419.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: sabo-matcha-1767687963419
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: sabo-matcha-1767687963419.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "90428776712"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:90428776712:web:5d6ab89f60815a9d638cbd"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE_ID
    value: matcha-console
    availability:
      - BUILD
      - RUNTIME

  # Server-only secrets (stored in Secret Manager)
  - variable: CATALOG_PASSCODE
    secret: CATALOG_PASSCODE
    availability:
      - RUNTIME
  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    secret: FIREBASE_SERVICE_ACCOUNT_KEY
    availability:
      - RUNTIME
