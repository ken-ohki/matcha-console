# Firebase App Hosting backend configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 2
  minInstances: 0
  concurrency: 80

env:
  # Public (client-side) Firebase config — embedded in client bundle, not sensitive
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAjwVm-tnjJUfWzBjv8Wh0oNZp-hEG4mr4
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: import-9b3ff.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: import-9b3ff
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: import-9b3ff.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "39425858444"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:39425858444:web:0389004f5e56d9d2b4d4a9"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE_ID
    value: chaflow
    availability:
      - BUILD
      - RUNTIME

  # Server-only secrets (stored in Secret Manager)
  - variable: CATALOG_PASSCODE
    secret: CATALOG_PASSCODE
    availability:
      - RUNTIME
  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    secret: FIREBASE_SERVICE_ACCOUNT_KEY
    availability:
      - RUNTIME
